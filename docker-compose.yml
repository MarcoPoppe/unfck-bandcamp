services:
  unfck-bandcamp:
    build: .
    image: unfck-bandcamp:latest
    container_name: unfck-bandcamp
    # Bind to loopback by default so the cookie-bearing endpoints are not
    # reachable from the LAN. Override with `BIND_HOST=0.0.0.0` if you need
    # remote access AND have set up a trusted reverse proxy with auth.
    ports:
      - "${BIND_HOST:-127.0.0.1}:3457:3457"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/unfck.db
      - AUDIO_CACHE_DIR=/app/data/audio_cache
      - COOKIE_FILE=/app/data/bc_cookies.txt
      - SYNC_INTERVAL_MIN=${SYNC_INTERVAL_MIN:-360}
      - MAX_AUDIO_CACHE_BYTES=${MAX_AUDIO_CACHE_BYTES:-2147483648}
      - DISCOVERY_RELEASES_PER_ARTIST=${DISCOVERY_RELEASES_PER_ARTIST:-12}
      - YTDLP_PATH=${YTDLP_PATH:-/usr/local/bin/yt-dlp}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3457/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

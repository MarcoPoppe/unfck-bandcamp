<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unfck Bandcamp</title>
  <link rel="icon" href="logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0b;
      color: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; }
    .logo {
      max-width: 320px;
      width: 60vw;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .err {
      margin-top: 12px;
      font-size: 12px;
      color: #d44;
      max-width: 360px;
      word-wrap: break-word;
    }
    .spinner {
      margin: 28px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid #222;
      border-top-color: #ffb300;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="unfck bandcamp" class="logo" />
    <div class="spinner"></div>
    <div class="status" id="s">Starting local server…</div>
    <div class="err" id="e"></div>
    <div class="hint" id="h"></div>
  </div>
  <style>
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
      max-width: 460px;
      line-height: 1.5;
    }
  </style>
  <script>
    // Poll the embedded sidecar until /api/health responds, then redirect
    // the WebView to the live UI. Tauri's setup hook spawns the Next.js
    // standalone server on this same loopback port. Probe with a short
    // backoff and surface progressive diagnostics so a stuck splash is
    // actionable rather than a silent freeze.
    const PORT = window.__UNFCK_PORT__ || 3457;
    const target = `http://127.0.0.1:${PORT}/`;
    const start = Date.now();
    const $s = document.getElementById('s');
    const $h = document.getElementById('h');
    const $e = document.getElementById('e');

    async function probe() {
      try {
        const r = await fetch(`${target}api/health`, { cache: 'no-store' });
        if (r.ok) {
          window.location.replace(target);
          return;
        }
      } catch (_) { /* server not up yet */ }

      const elapsed = Date.now() - start;
      if (elapsed > 5000 && elapsed < 15000) {
        $s.textContent = 'Booting Node sidecar…';
        $h.textContent = 'First start takes a few extra seconds while the bundled Node parses node_modules.';
      } else if (elapsed > 15000 && elapsed < 60000) {
        $s.textContent = 'Still trying to reach the local server…';
        $h.textContent =
          'If this hangs longer than a minute, press F12 to open DevTools — Console + Network tabs show what fetch returns. ' +
          'Sidecar logs land in the Tauri app-log directory (%LOCALAPPDATA%/com.unfck.bandcamp/logs/ on Windows).';
      } else if (elapsed >= 60000) {
        $s.textContent = 'Local server did not start.';
        $e.textContent =
          'The bundled Node sidecar failed to bind to port ' + PORT + ' within 60s. ' +
          'Press F12 → Console for browser-side errors, or open the app log folder to inspect the sidecar stdout.';
        $h.textContent =
          'Common causes: port ' + PORT + ' already in use by another tool, antivirus blocking node.exe, ' +
          'or a missing native module in the bundled node_modules tree.';
        return;
      }
      setTimeout(probe, 500);
    }

    probe();
  </script>
</body>
</html>

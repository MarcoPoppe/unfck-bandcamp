<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unfck Bandcamp</title>
  <link rel="icon" href="logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0b;
      color: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; }
    .logo {
      max-width: 320px;
      width: 60vw;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .err {
      margin-top: 12px;
      font-size: 12px;
      color: #d44;
      max-width: 360px;
      word-wrap: break-word;
    }
    .spinner {
      margin: 28px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid #222;
      border-top-color: #ffb300;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="unfck bandcamp" class="logo" />
    <div class="spinner"></div>
    <div class="status" id="s">Starting local server…</div>
    <div class="err" id="e"></div>
    <div class="hint" id="h"></div>
  </div>
  <style>
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
      max-width: 460px;
      line-height: 1.5;
    }
  </style>
  <script>
    // Wait for the embedded sidecar via Tauri IPC, then navigate to the
    // live UI. Doing the readiness check from Rust avoids the
    // tauri.localhost ↔ 127.0.0.1:3457 cross-origin CORS problem we'd
    // hit if the splash fetched /api/health itself. The Rust-side
    // probe is a TCP connect — same loopback, no browser CORS rules.
    const $s = document.getElementById('s');
    const $h = document.getElementById('h');
    const $e = document.getElementById('e');
    const stageMessages = [
      [0, 'Starting local server…', ''],
      [5000, 'Booting Node sidecar…', 'First start takes a few extra seconds while the bundled Node parses node_modules.'],
      [15000, 'Still trying to reach the local server…',
        'If this hangs longer than a minute, press F12 to open DevTools. ' +
        'Sidecar logs land in %LOCALAPPDATA%/com.unfck.bandcamp/logs/ on Windows.'],
    ];
    let stageIdx = 0;
    const startedAt = Date.now();
    const stageTimer = setInterval(() => {
      const elapsed = Date.now() - startedAt;
      while (stageIdx + 1 < stageMessages.length && elapsed >= stageMessages[stageIdx + 1][0]) {
        stageIdx++;
      }
      $s.textContent = stageMessages[stageIdx][1];
      $h.textContent = stageMessages[stageIdx][2];
    }, 500);

    async function start() {
      const tauri = window.__TAURI__;
      const invoke = tauri && tauri.core && tauri.core.invoke;
      if (!invoke) {
        clearInterval(stageTimer);
        $s.textContent = 'Splash not running inside Tauri.';
        $h.textContent =
          'This page expects the Tauri runtime. Open the app via the installer instead of loading the file directly.';
        return;
      }
      try {
        const port = await invoke('wait_for_server');
        clearInterval(stageTimer);
        window.location.replace(`http://127.0.0.1:${port}/`);
      } catch (err) {
        clearInterval(stageTimer);
        $s.textContent = 'Local server did not start.';
        $e.textContent = String(err);
        $h.textContent =
          'Common causes: port already in use by another tool, antivirus blocking node.exe, ' +
          'or a missing native module in the bundled node_modules tree. Logs in %LOCALAPPDATA%/com.unfck.bandcamp/logs/.';
      }
    }

    start();
  </script>
</body>
</html>

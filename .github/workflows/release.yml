name: Tauri Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Build matrix produces signed installers for Win/macOS/Linux + the
# `latest.json` manifest the Tauri updater plugin polls. Triggering a
# tag like `v2.0.0` runs the matrix; tauri-action attaches every
# artifact + the manifest to a single GitHub Release.
jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux deps (WebKitGTK + AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build + bundle (signed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Unfck Bandcamp ${{ github.ref_name }}"
          releaseBody: |
            See the changelog in CHANGELOG.md or the commit log for details.

            **Install (unsigned, for friend test):**
            - Windows: download the `.msi` and click "Run anyway" past SmartScreen.
            - macOS: download the `.dmg`, then right-click the app and "Open" once to bypass Gatekeeper.
            - Linux: download the `.AppImage`, `chmod +x`, run.

            Auto-update is enabled — future releases install themselves on next launch.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

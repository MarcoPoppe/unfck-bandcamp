name: Tauri Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Build matrix produces signed installers for Win/macOS/Linux + the
# `latest.json` manifest the Tauri updater plugin polls. Triggering a
# tag like `v2.0.0` runs the matrix; tauri-action attaches every
# artifact + the manifest to a single GitHub Release.
#
# Node bundling (v2.4.0+): before each `tauri build`, we download the
# official Node binary for the runner's OS and rename it to the
# `node-<TARGET_TRIPLE>` filename Tauri's externalBin mechanism
# expects. The bundler then packs Node into the installer so the
# user never needs Node on their machine.
env:
  NODE_BUNDLE_VERSION: "22.11.0"
  # Opt into Node.js 24 for the runner-side JS actions ahead of the
  # June 2026 enforcement, so we don't get the deprecation banner on
  # every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-tauri:
    permissions:
      contents: write
    # Trimmed matrix (v2.4.13): Apple Silicon + Windows x64 only.
    # Linux dropped — no Linux friends in the current circle. Intel
    # macOS dropped — friends on aarch64. If a Linux/Intel friend ever
    # asks, re-add the entry; tauri-action handles the rest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target_triple: "aarch64-apple-darwin"
            node_archive: "darwin-arm64.tar.gz"
          - platform: windows-latest
            args: ""
            target_triple: "x86_64-pc-windows-msvc"
            node_archive: "win-x64.zip"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match NODE_BUNDLE_VERSION above. better-sqlite3 prebuild
          # is selected by the Node version that runs `npm ci`, and the
          # binding has to load against the same NODE_MODULE_VERSION at
          # runtime — otherwise the sidecar dies with ERR_DLOPEN_FAILED.
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux deps (WebKitGTK + AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      # Download official Node binary for this OS and place it under
      # src-tauri/binaries/node-<TARGET_TRIPLE>[.exe] so Tauri's
      # externalBin packs it into the installer. The user's machine
      # then never needs a system-wide Node install.
      - name: Bundle Node (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -e
          VER="${NODE_BUNDLE_VERSION}"
          ARCHIVE="${{ matrix.node_archive }}"
          URL="https://nodejs.org/dist/v${VER}/node-v${VER}-${ARCHIVE}"
          mkdir -p src-tauri/binaries
          curl -fsSL "${URL}" -o /tmp/node.archive
          mkdir -p /tmp/node-extract
          if [[ "${ARCHIVE}" == *.tar.xz ]]; then
            tar -xJf /tmp/node.archive -C /tmp/node-extract
          else
            tar -xzf /tmp/node.archive -C /tmp/node-extract
          fi
          NODE_BIN="$(find /tmp/node-extract -type f -name node | head -1)"
          if [[ -z "${NODE_BIN}" ]]; then
            echo "Node binary not found in archive"
            exit 1
          fi
          cp "${NODE_BIN}" "src-tauri/binaries/node-${{ matrix.target_triple }}"
          chmod +x "src-tauri/binaries/node-${{ matrix.target_triple }}"
          ls -la src-tauri/binaries/

      - name: Bundle Node (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = $env:NODE_BUNDLE_VERSION
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $env:TEMP\node.zip
          Expand-Archive -Path $env:TEMP\node.zip -DestinationPath $env:TEMP\node-extract -Force
          $nodeBin = Get-ChildItem -Path $env:TEMP\node-extract -Recurse -Filter node.exe | Select-Object -First 1
          Copy-Item $nodeBin.FullName "src-tauri/binaries/node-${{ matrix.target_triple }}.exe"
          Get-ChildItem src-tauri/binaries/

      - name: Build + bundle (signed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Unfck Bandcamp ${{ github.ref_name }}"
          releaseBody: |
            Self-hosted Bandcamp discovery tool. **Doppelklick + los**: Node ist
            gebundelt, keine Vorbedingungen auf dem Rechner.

            **Install (unsigned):**
            - **Windows**: lad die `.msi` runter, doppelklick. Bei "Windows hat den PC geschützt" auf "Weitere Informationen" → "Trotzdem ausführen" klicken.
            - **macOS**: lad die `.dmg` runter, mounte sie, ziehe die App in /Applications. Beim ersten Öffnen Rechtsklick → "Öffnen" → "Öffnen" — danach normal startbar.
            - **Linux**: `.AppImage` runterladen, `chmod +x`, ausführen.

            Auto-update ist aktiv — neue Releases installieren sich beim nächsten App-Start automatisch.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

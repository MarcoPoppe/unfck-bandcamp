[package]
name = "unfck-bandcamp"
version = "2.4.25"
description = "Self-hosted Bandcamp discovery tool with Beatport-style UI"
authors = ["Marco Poppe"]
license = "MIT"
repository = "https://github.com/MarcoPoppe/unfck-bandcamp"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
